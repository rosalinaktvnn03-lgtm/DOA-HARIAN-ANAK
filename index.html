<!doctype html>

<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Doa Harian Anak</title>

<style>

body{margin:0;background:#fff9ed;color:#253323;font-family:Arial,sans-serif}

header{background:#31552b;color:white;text-align:center;padding:25px 15px;border-radius:0 0 25px 25px}

main{max-width:750px;margin:auto;padding:16px}

.card{background:white;border:1px solid #e8e6d9;border-radius:18px;padding:20px;margin-bottom:16px}

h2{color:#31552b}

.ar{font-family:"Times New Roman",serif;font-size:30px;line-height:2;text-align:right;direction:rtl}

.latin{line-height:1.8;color:#52604c}

.meaning{background:#f1f4e9;padding:12px;border-radius:10px;line-height:1.7}

button{border:0;background:#31552b;color:white;padding:12px 15px;border-radius:10px;font-size:15px;margin:5px 3px 5px 0}

.stop{background:#8c3828}

.note{font-size:13px;color:#69501b;line-height:1.7}

</style>

</head>

<body>

<header>

  <h1>🌙 Doa Harian Anak</h1>

  <p>Belajar doa dengan bacaan lengkap</p>

</header>

<main>

  <article class="card">

    <h2>1. Doa Sebelum Makan</h2>

    <div class="ar" lang="ar">

      بِسْمِ اللَّهِ

    </div>

    <h3>Bacaan Latin</h3>

    <p class="latin">Bismillāh.</p>

    <h3>Artinya</h3>

    <div class="meaning">Dengan nama Allah.</div>

    <h3>🎧 Dengarkan Bacaan Qari</h3>

    <!-- Ganti URL_AUDIO_MP3 dengan URL MP3 rekaman qari yang sah digunakan -->

    <audio id="audioQari" controls preload="none">

      <source src="URL_AUDIO_MP3" type="audio/mpeg">

      Browser tidak mendukung pemutar audio.

    </audio>

    <br>

    <button onclick="document.getElementById('audioQari').play()">

      ▶ Putar bacaan

    </button>

    <button class="stop" onclick="document.getElementById('audioQari').pause()">

      ■ Berhenti

    </button>

    <p class="note">

      Catatan: tombol audio akan berfungsi setelah URL_AUDIO_MP3

      diganti dengan alamat file MP3 yang benar.

    </p>

  </article>

</main>

</body>

</html>
